name: ✨ Feature
description: New functionality or capability
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Why is this needed? What's the motivating use case?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Roughly how should this work? (Doesn't need to be final — just enough to start.)
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Someday/maybe
        - Nice to have
        - Important
        - Urgent
      default: 1
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Area / module
      placeholder: e.g. auth, billing, ingest-pipeline
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, related issues, links, etc.
    validations:
      required: false
